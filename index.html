<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinemark · Prototipo TO-BE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ===================== CSS ===================== -->
<style>
/* --- Página y marco del celular --- */
html,body{height:100%}
body{margin:0;background:#08080A;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:844px;flex-shrink:0;border-radius:36px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #1C1C1F,0 0 0 12px #3A3A42,0 30px 80px rgba(0,0,0,.6);transform-origin:center center}
body.full #phone{border-radius:0;box-shadow:none}
#demo{position:fixed;top:16px;left:16px;width:220px;padding:14px;border-radius:14px;background:#1A1A1E;border:1px solid #2A2A30;color:#F5F5F5;font-size:13px;display:flex;flex-direction:column;gap:10px}
#demo b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#A1A1AA}
#demo select{min-height:36px;border-radius:8px;border:1px solid #3A3A42;background:#0E0E10;color:#F5F5F5;padding:0 8px;font:inherit}
#demo label{display:flex;flex-direction:column;gap:4px}
#demo label.chk{flex-direction:row;align-items:center;gap:8px}
#demo button{min-height:36px;border-radius:8px;border:1px solid #3A3A42;background:transparent;color:#F5F5F5;font:inherit;font-weight:600}
@media (max-width:900px){#demo{display:none}}

/* --- Estilos de la app (iguales al prototipo) --- */
body{margin:0}
a{color:#FF6B63}a:hover{color:#FF8F89}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:inherit}
input::placeholder{color:#8A8A93}
.tag{display:inline-block;background:#FFC83D;color:#1A1300;font-size:10px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:999px;vertical-align:middle;margin-left:6px}
.cta{width:100%;min-height:52px;border:0;border-radius:14px;background:#C8201B;color:#FFFFFF;font-size:16px;font-weight:700}
.ghost{width:100%;min-height:48px;border:1px solid #3A3A42;border-radius:14px;background:transparent;color:#F5F5F5;font-size:15px;font-weight:600}
.link{min-height:44px;border:0;background:transparent;color:#FF6B63;font-size:14px;font-weight:600;padding:0 4px}
.back{width:44px;height:44px;border-radius:22px;border:1px solid #2A2A30;background:#1A1A1E;color:#F5F5F5;font-size:18px;flex-shrink:0}
.card{background:#1A1A1E;border:1px solid #2A2A30;border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;border-radius:14px;border:1px solid #2A2A30;background:#1A1A1E;color:#F5F5F5;font-size:15px;font-weight:500;text-align:left}
.muted{color:#A1A1AA}
.sr{position:absolute;left:-9999px}
.scroll::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:40px;height:40px;border:4px solid #3A3A42;border-top-color:#FF6B63;border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes drop{from{transform:translateY(-120%)}to{transform:translateY(0)}}
.push{animation:drop .35s ease-out}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet{animation:rise .3s ease-out}
@keyframes zoomin{from{transform:scale(.2);opacity:.3}to{transform:scale(1);opacity:1}}
.splash{animation:zoomin .35s ease-out;transform-origin:22% 52%}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein .4s ease-out}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,99,.7)}50%{box-shadow:0 0 0 8px rgba(255,107,99,0)}}
.hint{animation:pulse 1.6s ease-in-out infinite}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;color:#FFFFFF;font-size:11px;font-weight:500;padding:0;min-height:44px;font-family:inherit}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.3)}}
.kb{animation:kb 12s linear forwards}
@keyframes prog{from{width:0}to{width:100%}}
.prog{animation:prog 12s linear forwards}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ico{width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<!-- ===================== HTML ===================== -->
<div id="stage"><div id="phone"><div id="app"></div></div></div>

<div id="demo">
<b>Demo</b>
<label>Escenario de pago
<select id="pEscenario"><option>Aprobado</option><option>Rechazado</option><option>Pendiente de verificación</option></select>
</label>
<label class="chk"><input type="checkbox" id="pCine"> Empezar con cine elegido</label>
<button id="pReset">Reiniciar prototipo</button>
</div>

<!-- Plantilla de la app: {{valor}} se reemplaza, sc-if muestra u oculta, sc-for repite -->
<template id="tpl">
<div style="width: 390px; height: 844px; background: #0E0E10; color: #F5F5F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div class="scroll" style="flex: 1; overflow-y: auto; scrollbar-width: none">

<!-- ============ HOME ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-weight: 800; font-size: 24px; letter-spacing: -0.02em">cinemark</span>
<button onClick="{{tabEntradas}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2A2A30; background: #1A1A1E; color: #F5F5F5; font-size: 13px; font-weight: 600">Mis entradas · {{ticketCount}}</button>
</div>

<sc-if value="{{noCine}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 16px; padding: 16px; background: #1A1A1E; border: 1px solid #3A3A42; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 16px; font-weight: 700">Elegí tu cine para ver horarios</span>
<span class="muted" style="font-size: 13px; line-height: 1.4">Lo recordamos para la próxima. Podés cambiarlo cuando quieras.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="cta" onClick="{{goCines}}" style="min-height: 46px; font-size: 15px">Elegir cine</button>
<button class="ghost" onClick="{{useLocation}}" style="min-height: 46px; font-size: 14px">Usar mi ubicación</button>
</div>
</div>
</sc-if>
<sc-if value="{{hasCine}}" hint-placeholder-val="{{ false }}">
<button onClick="{{goCines}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; border-radius: 16px; border: 1px solid #2A2A30; background: #1A1A1E; color: #F5F5F5; text-align: left">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B63" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="muted" style="font-size: 12px">Tu cine</span><span style="font-size: 16px; font-weight: 600">{{cine}}</span></span>
<span style="font-size: 13px; color: #FF6B63; font-weight: 600">Cambiar</span>
</button>
</sc-if>

<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #2A2A30; background: #1A1A1E; position: relative">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span class="sr">Buscar película</span>
<input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="Buscar película" style="flex: 1; min-height: 44px; border: 0; background: transparent; color: #F5F5F5; font-size: 15px; outline: none">
</label>

<div role="tablist" aria-label="Películas" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #1A1A1E; border: 1px solid #2A2A30">
<button role="tab" aria-selected="{{segCartelera}}" onClick="{{goSegCartelera}}" style="{{segCarteleraS}}">En cartelera</button>
<button role="tab" aria-selected="{{segProximos}}" onClick="{{goSegProximos}}" style="{{segProximosS}}">Próximos estrenos</button>
</div>

<sc-if value="{{searching}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="muted" style="font-size: 13px">{{searchLabel}}</span>
<sc-for list="{{searchResults}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.open}}" class="row" style="min-height: 72px">
<span style="{{m.thumb}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{m.t}}</span><span class="muted" style="font-size: 12px">{{m.sub}}</span></span>
<span class="muted">›</span>
</button>
</sc-for>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div class="card" style="display: flex; flex-direction: column; gap: 6px; text-align: center; padding: 24px 16px">
<span style="font-size: 15px; font-weight: 600">No encontramos “{{q}}”</span>
<span class="muted" style="font-size: 13px">Probá con otro título o revisá la cartelera.</span>
<button class="link" onClick="{{clearSearch}}" style="align-self: center">Ver cartelera</button>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{notSearching}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{segCartelera}}" hint-placeholder-val="{{ true }}">
<div style="{{heroStyle}}">
<span style="{{heroBadgeStyle}}">{{heroBadge}}</span>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 78%">
<span style="font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; text-shadow: 0 2px 10px rgba(0,0,0,.6)">{{heroTitle}}</span>
<span style="font-size: 13px; line-height: 1.35; text-shadow: 0 1px 6px rgba(0,0,0,.8)">{{heroTag}}</span>
<span style="font-size: 12px; color: #D4D4D8">{{heroMeta}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<button onClick="{{heroOpen}}" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #C8201B; color: #FFFFFF; font-size: 14px; font-weight: 700">Comprar entradas</button>
<div style="display: flex; gap: 2px">
<sc-for list="{{heroDots}}" as="hd" hint-placeholder-count="3">
<button onClick="{{hd.pick}}" aria-label="{{hd.aria}}" aria-pressed="{{hd.on}}" style="width: 28px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="{{hd.dot}}"></span></button>
</sc-for>
</div>
</div>
</div>

<div style="display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none" class="scroll">
<sc-for list="{{promos}}" as="pr" hint-placeholder-count="3">
<button onClick="{{pr.tap}}" style="{{pr.style}}">
<span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; opacity: .85">{{pr.k}}</span>
<span style="font-size: 17px; font-weight: 800; line-height: 1.15">{{pr.t}}</span>
<span style="font-size: 12px; line-height: 1.35; opacity: .9">{{pr.d}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{showQuieroRow}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 17px; font-weight: 700">Tus guardadas</span><button class="link" onClick="{{tabQuiero}}">Ver todas</button></div>
<div style="display: flex; gap: 10px; overflow-x: auto">
<sc-for list="{{savedCards}}" as="s" hint-placeholder-count="2">
<button onClick="{{s.open}}" style="width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; border: 1px solid #2A2A30; background: #1A1A1E; color: #F5F5F5; text-align: left">
<span style="{{s.poster}}"><span style="font-weight: 800; font-size: 12px; line-height: 1.1; color: #FFFFFF">{{s.t}}</span></span>
<span style="{{s.statusStyle}}">{{s.status}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">En cartelera</h1>
<span class="muted" style="font-size: 13px">{{carteleraSub}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px">
<sc-for list="{{carteleraA}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.open}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: transparent; color: #F5F5F5; text-align: left; min-width: 0">
<span style="{{m.posterG}}">
<sc-if value="{{m.themed}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: #0E0E10; background: linear-gradient(90deg, #3B82F6, #F5B83D, #A855F7)">Sala temática</span></sc-if>
<span style="align-self: flex-end; margin-top: auto; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: rgba(14,14,16,.8)">{{m.cl}}</span>
</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.2">{{m.t}}</span>
<span class="muted" style="font-size: 12px">{{m.genero}} · {{m.dur}}</span>
<span class="muted clamp" style="font-size: 12px; line-height: 1.4">{{m.d}}</span>
<span style="{{m.nextStyle}}">{{m.nextShort}}</span>
</button>
</sc-for>
</div>

<button onClick="{{adTap}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; border: 0; background: linear-gradient(110deg, #7A1F12 0%, #C8501B 55%, #F5B83D 130%); color: #FFFFFF; text-align: left; position: relative; overflow: hidden">
<svg aria-hidden="true" width="62" height="74" viewBox="0 0 62 74" style="flex-shrink: 0"><path d="M10 26h42l-5 44H15z" fill="#FFFFFF"></path><path d="M19 26l3 44M31 26v44M43 26l-3 44" stroke="#C8201B" stroke-width="5"></path><g fill="#FFE9A8"><circle cx="16" cy="20" r="8"></circle><circle cx="29" cy="14" r="9"></circle><circle cx="43" cy="18" r="8"></circle><circle cx="23" cy="24" r="7"></circle><circle cx="37" cy="24" r="7"></circle></g></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: .12em; opacity: .85">PUBLICIDAD</span>
<span style="font-size: 18px; font-weight: 800; line-height: 1.15">Combo Estreno</span>
<span style="font-size: 12px; line-height: 1.35">Pochoclos grandes + 2 bebidas. Sumalo al comprar tu entrada.</span>
</span>
<span style="font-size: 20px">›</span>
</button>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px">
<sc-for list="{{carteleraB}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.open}}" style="display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: transparent; color: #F5F5F5; text-align: left; min-width: 0">
<span style="{{m.posterG}}">
<sc-if value="{{m.themed}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; color: #0E0E10; background: linear-gradient(90deg, #3B82F6, #F5B83D, #A855F7)">Sala temática</span></sc-if>
<span style="align-self: flex-end; margin-top: auto; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: rgba(14,14,16,.8)">{{m.cl}}</span>
</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.2">{{m.t}}</span>
<span class="muted" style="font-size: 12px">{{m.genero}} · {{m.dur}}</span>
<span class="muted clamp" style="font-size: 12px; line-height: 1.4">{{m.d}}</span>
<span style="{{m.nextStyle}}">{{m.nextShort}}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{segProximos}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Próximos estrenos</h1>
<span class="muted" style="font-size: 13px">Guardalos en «Quiero verla» y te avisamos cuando tengan funciones</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{proximamente}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.open}}" style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; border: 1px solid #2A2A30; background: #1A1A1E; color: #F5F5F5; text-align: left">
<span style="{{m.posterWide}}"><span style="font-weight: 800; font-size: 13px; line-height: 1.1; color: #FFFFFF">{{m.t}}</span></span>
<span style="font-size: 12px; font-weight: 600">Estreno {{m.estreno}} · {{m.genero}}</span>
<span class="muted clamp" style="font-size: 12px; line-height: 1.4">{{m.d}}</span>
<span style="{{m.savedStyle}}">{{m.savedLabel}}</span>
</button>
</sc-for>
</div>
</sc-if>
</sc-if>
</div>
</sc-if>

<!-- ============ CINES ============ -->
<sc-if value="{{isCines}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<button class="back" aria-label="Volver" onClick="{{back}}">←</button>
<span style="font-size: 20px; font-weight: 700">Elegí tu cine</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #2A2A30; background: #1A1A1E; position: relative">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span class="sr">Buscar cine o barrio</span>
<input type="search" value="{{qCine}}" onChange="{{onSearchCine}}" placeholder="Buscar cine o barrio" style="flex: 1; min-height: 44px; border: 0; background: transparent; color: #F5F5F5; font-size: 15px; outline: none">
</label>
<button class="ghost" onClick="{{useLocation}}">Usar mi ubicación</button>
<sc-for list="{{cines}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">{{c.n}}</span><span class="muted" style="font-size: 12px">{{c.z}}</span></span>
<span style="font-size: 13px; font-weight: 600; color: #FF6B63">{{c.tag}}</span>
</button>
</sc-for>
</div>
</sc-if>

<!-- ============ FICHA ============ -->
<sc-if value="{{isFicha}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<div style="{{fichaHero}}">
<button class="back" aria-label="Volver" onClick="{{back}}" style="position: absolute; top: 16px; left: 16px; background: rgba(14,14,16,.7)">←</button>
<span style="position: absolute; top: 26px; right: 16px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(14,14,16,.7)">{{fichaKind}}</span>
<button onClick="{{openTrailer}}" aria-label="Ver tráiler" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 32px; border: 2px solid rgba(255,255,255,.85); background: rgba(200,32,27,.9); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"></path></svg></button>
</div>
<div style="padding: 0 20px 24px; margin-top: -60px; position: relative; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 14px; align-items: flex-end">
<span style="{{movieBigPoster}}"></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h1 style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.15">{{movieTitle}}</h1>
<span class="muted" style="font-size: 13px">{{movieEstreno}}</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{movieChips}}" as="ch" hint-placeholder-count="3">
<span style="{{ch.style}}">{{ch.l}}</span>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="ghost" onClick="{{openTrailer}}" style="display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>Ver tráiler</button>
<button onClick="{{toggleSaved}}" aria-pressed="{{movieSaved}}" style="{{saveBtnStyle}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="{{saveIconFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
{{saveBtnLabel}}
</button>
</div>
<sc-if value="{{isThemedMovie}}" hint-placeholder-val="{{ false }}">

<span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF">cinemark</span>
<div role="img" aria-label="Cargando" style="width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.35); border-top-color: #FFFFFF; border-radius: 50%; animation: spin .9s linear infinite"></div>
</div>
</sc-if>

<!-- ============ AYUDA EN EL FLUJO (SHEET) ============ -->
<sc-if value="{{showHelpSheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; justify-content: flex-end">
<div class="sheet" role="dialog" aria-label="Ayuda con este paso" style="background: #1A1A1E; border-top: 1px solid #3A3A42; border-radius: 22px 22px 0 0; padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 12px; max-height: 86%; overflow-y: auto; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 18px; font-weight: 700">{{helpTitleSheet}}</span>
<button aria-label="Cerrar ayuda" onClick="{{closeHelp}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A3A42; background: transparent; color: #F5F5F5; font-size: 18px">×</button>
</div>
<div style="border-radius: 14px; padding: 12px 14px; background: #0E0E10; border: 1px solid #2A2A30; display: flex; flex-direction: column; gap: 3px">
<span class="muted" style="font-size: 12px">Vinculamos tu consulta a lo que estás viendo</span>
<span style="font-size: 14px; font-weight: 700">{{helpCtxStep}}</span>
<span class="muted" style="font-size: 13px; line-height: 1.4">{{helpCtxDetail}}</span>
</div>

<sc-if value="{{helpMenu}}" hint-placeholder-val="{{ true }}">
<button class="row" onClick="{{helpGoChat}}" style="min-height: 64px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B63" stroke-width="2" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Chatear con el asistente virtual</span><span class="muted" style="font-size: 12px">Respuesta inmediata, las 24 h</span></span><span class="muted">›</span>
</button>
<button class="row" onClick="{{helpGoAsesor}}" style="min-height: 64px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B63" stroke-width="2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Hablar con un asesor</span><span class="muted" style="font-size: 12px">Por chat o por teléfono · ve este paso de tu compra</span></span><span class="muted">›</span>
</button>
<button class="row" onClick="{{helpGoForm}}" style="min-height: 64px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B63" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Dejar un reclamo</span><span class="muted" style="font-size: 12px">Te respondemos en la app y por mail</span></span><span class="muted">›</span>
</button>
<span class="muted" style="font-size: 12px; text-align: center">Tu compra no se pierde: seguís donde estabas al cerrar.</span>
</sc-if>

<sc-if value="{{helpChat}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column-reverse; gap: 8px; max-height: 280px; overflow-y: auto">
<sc-for list="{{chatMsgs}}" as="cm" hint-placeholder-count="2">
<div style="{{cm.style}}"><span style="{{cm.whoStyle}}">{{cm.who}}</span><span>{{cm.t}}</span></div>
</sc-for>
</div>
<sc-if value="{{showQuick}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{quickReplies}}" as="qk" hint-placeholder-count="3">
<button onClick="{{qk.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #3A3A42; background: #0E0E10; color: #F5F5F5; font-size: 13px; text-align: left">{{qk.l}}</button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; gap: 8px">
<label style="flex: 1"><span class="sr">Mensaje</span><input type="text" value="{{chatInput}}" onChange="{{onChatInput}}" placeholder="Escribí tu consulta" style="width: 100%; box-sizing: border-box; min-height: 46px; border-radius: 12px; border: 1px solid #3A3A42; background: #0E0E10; color: #F5F5F5; padding: 0 14px; font-size: 15px"></label>
<button onClick="{{sendChat}}" aria-label="Enviar mensaje" style="width: 46px; height: 46px; border-radius: 12px; border: 0; background: #C8201B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M3 20l18-8L3 4v6l12 2-12 2z"></path></svg></button>
</div>
<sc-if value="{{showQuick}}" hint-placeholder-val="{{ true }}"><button class="ghost" onClick="{{helpGoAsesor}}">Hablar con un asesor</button></sc-if>
<button class="link" onClick="{{helpGoMenu}}" style="align-self: center">Volver</button>
</sc-if>

<sc-if value="{{helpAsesor}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; line-height: 1.45">Elegí cómo hablar con un asesor. Ya ve en qué paso estás y los datos de tu compra.</span>
<button class="row" onClick="{{startAgentChat}}" style="min-height: 64px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B63" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Chat con un asesor</span><span class="muted" style="font-size: 12px">Espera estimada: 2 min</span></span><span class="muted">›</span>
</button>
<button class="row" onClick="{{helpGoCall}}" style="min-height: 64px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#FF6B63"><path d="M6.6 3.5l2.9-.4 1.6 4.3-2 1.4a12 12 0 0 0 6.1 6.1l1.4-2 4.3 1.6-.4 2.9A2.5 2.5 0 0 1 18 20 15 15 0 0 1 4 6a2.5 2.5 0 0 1 2.6-2.5z"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Llamar al centro de atención</span><span class="muted" style="font-size: 12px">Con un código que vincula tu compra</span></span><span class="muted">›</span>
</button>
<button class="link" onClick="{{helpGoMenu}}" style="align-self: center">Volver</button>
</sc-if>

<sc-if value="{{helpForm}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; font-weight: 600">¿Qué pasó?</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{helpMotivos}}" as="hm" hint-placeholder-count="4">
<button onClick="{{hm.pick}}" aria-pressed="{{hm.on}}" style="{{hm.style}}">{{hm.l}}</button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Contanos más (opcional)
<textarea value="{{helpText}}" onChange="{{helpOnText}}" rows="3" placeholder="Por ejemplo: aparece un error al tocar Pagar" style="border-radius: 12px; border: 1px solid #3A3A42; background: #0E0E10; color: #F5F5F5; padding: 12px 14px; font-size: 15px; font-family: inherit; resize: none"></textarea>
</label>
<span class="muted" style="font-size: 12px; line-height: 1.4">Adjuntamos automáticamente: paso del flujo, película, función, butacas, total y hora.</span>
<button class="cta" disabled="{{noHelpMotivo}}" onClick="{{sendClaim}}">Enviar reclamo</button>
<button class="link" onClick="{{helpGoMenu}}" style="align-self: center">Volver</button>
</sc-if>

<sc-if value="{{helpSent}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 16px; padding: 16px; background: #10291D; border: 1px solid #1F5A3D; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 700">Reclamo enviado · Caso {{caseId}}</span>
<span style="font-size: 13px; line-height: 1.45">Motivo: {{helpMotivo}}. Quedó vinculado a «{{helpCtxStep}}». Te respondemos en la app y por mail; si tu función es hoy, en menos de 30 minutos.</span>
</div>
<button class="cta" onClick="{{closeHelp}}">Seguir con mi compra</button>
</sc-if>

<sc-if value="{{helpCall}}" hint-placeholder-val="{{ false }}">
<div style="border-radius: 16px; padding: 16px; background: #0E0E10; border: 1px solid #2A2A30; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">Centro de atención</span>
<span style="font-size: 20px; font-weight: 800">0800 [línea oficial]</span>
<span style="font-size: 13px; line-height: 1.45">Al llamar, decí tu código <b>{{callCode}}</b>: el operador ve en qué paso estás y los datos de tu compra, sin que repitas nada.</span>
</div>
<button class="cta" onClick="{{doCall}}">Llamar</button>
<button class="link" onClick="{{helpGoMenu}}" style="align-self: center">Volver</button>
</sc-if>
</div>
</div>
</sc-if>

<!-- ============ TRÁILER ============ -->
<sc-if value="{{showTrailer}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Tráiler" style="position: absolute; inset: 0; background: rgba(0,0,0,.94); display: flex; flex-direction: column; justify-content: center; padding: 20px; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 16px; font-weight: 700">Tráiler · {{movieTitle}}</span>
<button aria-label="Cerrar tráiler" onClick="{{closeTrailer}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A3A42; background: transparent; color: #F5F5F5; font-size: 18px; flex-shrink: 0">×</button>
</div>
<div style="{{trailerFrame}}">
<sc-if value="{{trailerPlaying}}" hint-placeholder-val="{{ false }}">
<div class="kb" style="{{trailerArt}}"></div>
<span class="fade" style="position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; padding: 0 16px; font-size: 16px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.9)">{{trailerCaption}}</span>
</sc-if>
<sc-if value="{{trailerShowPlay}}" hint-placeholder-val="{{ true }}">
<button onClick="{{playTrailer}}" aria-label="{{trailerPlayLabel}}" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 34px; border: 2px solid rgba(255,255,255,.85); background: rgba(200,32,27,.92); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"></path></svg></button>
</sc-if>
</div>
<sc-if value="{{trailerPlaying}}" hint-placeholder-val="{{ false }}"><div style="height: 4px; border-radius: 2px; background: #3A3A42; overflow: hidden"><div class="prog" style="height: 100%; background: #C8201B"></div></div></sc-if>
<span class="muted" style="font-size: 12px; line-height: 1.4">{{movieGenre}}</span>
<span class="muted" style="font-size: 12px; line-height: 1.4">Tráiler simulado: en la app real se reproduce el video oficial.</span>
<button class="cta" onClick="{{closeTrailer}}">Volver a la película</button>
</div>
</sc-if>

<!-- ============ PERMISO (SHEET) ============ -->
<sc-if value="{{showSheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; justify-content: flex-end">
<div class="sheet" role="dialog" aria-label="Activar aviso" style="background: #1A1A1E; border-top: 1px solid #3A3A42; border-radius: 22px 22px 0 0; padding: 22px 20px 34px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 700">Guardamos «{{movieTitle}}»</span>
<span style="font-size: 14px; line-height: 1.45" class="muted">¿Te avisamos cuando haya funciones {{sheetWhere}}? Es un solo aviso por película y lo podés desactivar cuando quieras.</span>
<button class="cta" onClick="{{sheetYes}}">Sí, avisame</button>
<button class="ghost" onClick="{{sheetNo}}">Ahora no</button>
</div>
</div>
</sc-if>

<!-- ============ PUSH ============ -->
<sc-if value="{{showPush}}" hint-placeholder-val="{{ false }}">
<div class="push" style="position: absolute; top: 10px; left: 10px; right: 10px; border-radius: 18px; background: #26262B; border: 1px solid #3A3A42; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5)">
<span style="display: flex; gap: 8px; align-items: center"><span style="width: 22px; height: 22px; border-radius: 6px; background: #C8201B; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">c</span><span class="muted" style="font-size: 12px">Cinemark · ahora</span></span>
<span style="font-size: 14px; font-weight: 700">«{{pushTitle}}» ya tiene funciones en {{pushCine}}</span>
<span style="font-size: 13px; line-height: 1.4">La guardaste en Quiero verla. Mirá los horarios.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{dismissPush}}" style="min-height: 44px; border-radius: 12px; border: 1px solid #3A3A42; background: transparent; color: #F5F5F5; font-size: 14px; font-weight: 600">Después</button>
<button onClick="{{openPush}}" style="min-height: 44px; border-radius: 12px; border: 0; background: #C8201B; color: #FFFFFF; font-size: 14px; font-weight: 700">Ver horarios</button>
</div>
</div>
</sc-if>

<!-- ============ TOAST ============ -->
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="{{toastStyle}}">{{toast}}</div>
</sc-if>

<!-- ============ TAB BAR ============ -->
<sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Secciones" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2A2A30; background: #141416; padding: 6px 4px 22px">
<button onClick="{{tabHome}}" style="{{tabHomeS}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 5v14M17 5v14M3 12h4M17 12h4"></path></svg>
<span>Cartelera</span>
</button>
<button onClick="{{tabEntradas}}" style="{{tabEntradasS}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path></svg>
<span>Entradas</span>
</button>
<button onClick="{{tabQuiero}}" style="{{tabQuieroS}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
<span>Quiero verla</span>
</button>
<button onClick="{{tabCuenta}}" style="{{tabCuentaS}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<span>Cuenta</span>
</button>
</nav>
</sc-if>

<!-- ============ BARRA DE INICIO (volver al teléfono) ============ -->
<sc-if value="{{showIndicator}}" hint-placeholder-val="{{ true }}">
<button onClick="{{goPhone}}" aria-label="Salir al inicio del teléfono" style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 180px; height: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 134px; height: 5px; border-radius: 3px; background: #F5F5F5; opacity: .85"></span>
</button>
</sc-if>

</div>

        style: 'display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 14px; font-size: 15px; font-weight: 500; border: 1px solid ' + (st.help === h.k ? red : '#2A2A30') + '; background: #1A1A1E; color: #F5F5F5' })),
      hasHelp: !!cur, helpTitle: cur ? cur.t : '', helpBody: cur ? cur.b : '',
      noSaved: st.saved.length === 0, savedList: savedList,
      canSimulate: simTarget !== undefined && st.notif,
      simulateAlert: () => { const r = Object.assign({}, this.state.released); r[simTarget] = true; this.setState({ released: r, push: simTarget, cine: this.state.cine || 'Unicenter' }); },
      showSheet: st.sheet, sheetWhere: cine ? 'en ' + cine : 'en tu cine',
      sheetYes: () => { const a = Object.assign({}, this.state.alerts); a[this.state.movie] = true; this.setState({ alerts: a, sheet: false }); this.showToast(this.state.notif ? 'Te avisamos cuando tenga funciones' : 'Aviso guardado: activá los avisos en Cuenta'); },
      sheetNo: () => { const a = Object.assign({}, this.state.alerts); a[this.state.movie] = false; this.setState({ alerts: a, sheet: false }); this.showToast('Guardada sin aviso'); },
      showPush: st.push >= 0, pushTitle: st.push >= 0 ? all.at(st.push).t : '', pushCine: cine || 'Unicenter',
      dismissPush: () => this.setState({ push: -1 }),
      openPush: () => this.setState({ push: -1, stack: ['quiero'], screen: 'ficha', movie: this.state.push }),
      accountName: st.loggedIn ? 'Sofía' : 'Invitado', accountSub: st.loggedIn ? 'Ingresaste con Google' : 'Ingresá para guardar tus entradas y tu lista en todos tus dispositivos',
      loginLabel: st.loggedIn ? 'Cerrar sesión' : 'Ingresar', toggleLogin: () => this.setState({ loggedIn: !this.state.loggedIn }),
      notifOn: st.notif, toggleNotif: () => this.setState({ notif: !this.state.notif }),
      notifTrack: 'width: 46px; height: 28px; border-radius: 14px; flex-shrink: 0; position: relative; background: ' + (st.notif ? '#C8201B' : '#3A3A42'),
      notifKnob: 'position: absolute; top: 3px; left: ' + (st.notif ? '21px' : '3px') + '; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF',
      clubToast: () => this.showToast('Cinemark Club queda fuera del alcance de este prototipo'),
      hasToast: st.toast !== '', toast: st.toast,
      toastStyle: 'position: absolute; left: 16px; right: 16px; bottom: ' + (tabsOn.indexOf(scr) >= 0 ? '96px' : '24px') + '; padding: 14px 16px; border-radius: 14px; background: #F5F5F5; color: #0E0E10; font-size: 14px; font-weight: 600; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4)'
    };
  }
}

/* ---------- Arranque, panel Demo y tamaño del celular ---------- */
var props = { empezarEnTelefono: true, escenarioPago: 'Aprobado', empezarConCine: false, precio: 9000, cargo: 700, comboPrecio: 12000 };
var component;
function start() { if (component) clearInterval(component._hi); component = new Component(props); lastScreen = null; render(); }
document.getElementById('pEscenario').addEventListener('change', function (e) { props.escenarioPago = e.target.value; });
document.getElementById('pCine').addEventListener('change', function (e) { props.empezarConCine = e.target.checked; start(); });
document.getElementById('pReset').addEventListener('click', start);
function fit() {
  var w = window.innerWidth, h = window.innerHeight, small = w < 500;
  document.body.classList.toggle('full', small);
  var s = small ? Math.min(w / 390, h / 844) : Math.min(1, (h - 40) / 844, (w - 40) / 390);
  document.getElementById('phone').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
start();
</script>
